tasks:
  - name: containers_sources
    reference_sql: "SELECT source_id, ecosystem, authentication, search_mode FROM containers.main.sources() ORDER BY source_id"
  - name: containers_capabilities
    reference_sql: "SELECT source_id, operation, supported, search_mode FROM containers.main.capabilities() ORDER BY source_id, operation"
  - name: containers_source_status
    reference_sql: "SELECT source_id, search_mode, ready FROM containers.main.source_status() ORDER BY source_id"
  - name: containers_search
    reference_sql: "SELECT name FROM containers.main.search('dockerhub_public', 'postgres', 5) ORDER BY name"
  - name: containers_repository
    reference_sql: "SELECT name, description FROM containers.main.repository('dockerhub_public', 'library/hello-world') ORDER BY name"
  - name: containers_tags
    reference_sql: "SELECT tag FROM containers.main.tags('dockerhub_public', 'library/hello-world', max_results := 10) ORDER BY tag"
  - name: containers_manifest
    reference_sql: "SELECT digest, media_type FROM containers.main.manifest('quay_public', 'prometheus/prometheus', 'sha256:89c1a644817e9ad70fa2af76c84898e327c1de7063735f962e8313b1e28672c3') ORDER BY digest"
  - name: containers_platforms
    reference_sql: "SELECT digest, os, architecture FROM containers.main.platforms('quay_public', 'prometheus/prometheus', 'sha256:89c1a644817e9ad70fa2af76c84898e327c1de7063735f962e8313b1e28672c3') ORDER BY digest"
  - name: containers_layers
    reference_sql: "SELECT position, digest, size FROM containers.main.layers('quay_public', 'prometheus/prometheus', 'sha256:89c1a644817e9ad70fa2af76c84898e327c1de7063735f962e8313b1e28672c3') ORDER BY position"
  - name: containers_configuration
    reference_sql: "SELECT os, architecture, config_digest FROM containers.main.configuration('quay_public', 'prometheus/prometheus', 'sha256:89c1a644817e9ad70fa2af76c84898e327c1de7063735f962e8313b1e28672c3') ORDER BY config_digest"
