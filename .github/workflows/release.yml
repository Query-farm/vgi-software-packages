name: Release

# Push a tag like v0.1.0. This gates on CI, then compiles the worker with
# `bun build --compile` into a standalone executable per platform (linux x86-64 and
# arm64, macOS arm64, Windows x86-64), signs each archive with cosign, attests its
# build provenance and attaches it to the GitHub release (shared ts-release.yml).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # In the template repositories a vX.Y.Z tag is a template version, not a worker
    # release, so only a manual run builds there. Forks release on every tag.
    if: ${{ github.event_name != 'push' || !startsWith(github.repository, 'Query-farm/vgi-starter-') }}
    uses: ./.github/workflows/ci.yml

  prepare-release:
    needs: [ci]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: ci/check-version.sh "$GITHUB_REF_NAME"
      - name: Prepare release once before parallel uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi

  release:
    needs: [prepare-release]
    strategy:
      matrix:
        include:
          - bin: vgi-packages-worker
            entry: src/worker.ts
          - bin: vgi-containers-worker
            entry: src/container_worker.ts
          - bin: vgi-software-index
            entry: src/software/index_cli.ts
    permissions:
      contents: write        # create the release, attach assets
      id-token: write        # keyless signing + provenance
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/ts-release.yml@v1
    secrets: inherit
    with:
      bin: ${{ matrix.bin }}
      asset_prefix: ${{ matrix.bin }}
      entry: ${{ matrix.entry }}
      version_check_cmd: ci/check-version.sh
      include: README.md,LICENSE,config.example.json

  publish-release:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish after all signed platform archives are uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
