# Private graders for the public vgi.agent_test_tasks in the worker's catalog metadata.
# `vgi-lint lint --ai` runs an agent on each prompt and grades it with check_sql.
# See https://github.com/Query-farm/vgi-lint-check (VGI920).
tasks:
  - name: packages_new_sources
    reference_sql: "SELECT source_id, ecosystem, search_mode FROM packages.main.sources() WHERE ecosystem IN ('packagist','pub','hex','cran','bioconductor','vcpkg') ORDER BY source_id"
  - name: packages_composer_dependencies
    reference_sql: "SELECT dependency, requirement FROM packages.main.dependencies('packagist_public','monolog/monolog','3.9.0') WHERE kind='require' ORDER BY dependency"
  - name: formal_greeting
    reference_sql: SELECT packages.main.greet('Grace', 'formal') AS greeting
  - name: sum_of_squares
    reference_sql: SELECT sum(squared) AS total FROM packages.main.sequence_table(10)
  - name: stepped_sequence
    reference_sql: SELECT n FROM packages.main.sequence_table(4, step := 5) ORDER BY n
  # Reads the public demo API (https://vgi-starter-api.query-farm.services/v1).
  - name: items_per_category
    check_sql: >-
      SELECT count(*) = 3 AND sum(items) = 25
      FROM (SELECT category, count(*) AS items
            FROM packages.main.fetch_items('https://vgi-starter-api.query-farm.services/v1') GROUP BY category)

  - name: packages_sources
    reference_sql: "SELECT source_id, ecosystem, authentication, search_mode FROM packages.main.sources() ORDER BY source_id"
  - name: packages_capabilities
    reference_sql: "SELECT source_id, operation, supported, search_mode FROM packages.main.capabilities() ORDER BY source_id, operation"
  - name: packages_source_status
    reference_sql: "SELECT source_id, search_mode, ready FROM packages.main.source_status() ORDER BY source_id"
  - name: packages_search
    reference_sql: "SELECT name FROM packages.main.search('npm_public', 'typescript', 5) ORDER BY name"
  - name: packages_package
    reference_sql: "SELECT name, version, description FROM packages.main.package('pypi_public', 'requests') ORDER BY name"
  - name: packages_versions
    reference_sql: "SELECT version FROM packages.main.versions('pypi_public', 'requests') ORDER BY version"
  - name: packages_artifacts
    reference_sql: "SELECT filename, artifact_type, hashes FROM packages.main.artifacts('pypi_public', 'requests', '2.32.3') ORDER BY filename"
  - name: packages_dependencies
    reference_sql: "SELECT dependency, requirement, kind, condition FROM packages.main.dependencies('pypi_public', 'requests', '2.32.3') ORDER BY dependency, requirement, kind, condition"
